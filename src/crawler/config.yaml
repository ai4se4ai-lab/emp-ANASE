# =============================================================================
# Configuration for Analogical Reasoning Data Collector
# =============================================================================
# WARNING: This tool must be used in compliance with each platform's Terms of
# Service and API policies. Obtain all necessary API keys before use.
# =============================================================================

project:
  name: "analogical_reasoning_software_engineering"
  version: "1.0.0"
  output_dir: "./output"
  log_dir: "./logs"

# Date range for data collection (ISO 8601)
date_range:
  start: "2025-09-01"
  end: "2026-02-28"

# Keyword configuration for analogy detection
keywords:
  analogy_indicators:
    - "like a"
    - "like an"
    - "looks like"
    - "feels like"
    - "similar to"
    - "analogous to"
    - "analogy"
    - "metaphor"
    - "metaphorical"
    - "as if"
    - "as though"
    - "just like"
    - "much like"
    - "works like"
    - "behaves like"
    - "acts like"
    - "functions like"
    - "serves as"
    - "resembles"
    - "is comparable to"
    - "compared to"
    - "can be compared to"
    - "think of it as"
    - "you can think of it as"
    - "imagine it as"
    - "picture it as"
    - "visualize it as"
    - "consider it as"
    - "it's basically"
    - "it's kind of like"
    - "it's almost like"
    - "in the same way"
    - "in much the same way"
    - "parallel to"
    - "equivalent to"
    - "maps to"
    - "corresponds to"
    - "mirror of"
    - "modelled after"

  # Software-engineering context terms.
  # A record is considered relevant when it contains analogy language AND at
  # least one of these terms. This intentionally captures analogies about bugs,
  # solutions, architecture, APIs, tests, deployments, and developer workflow,
  # not only analogies about one specific tool family.
  se_context_terms:
    - "software"
    - "code"
    - "program"
    - "application"
    - "app"
    - "system"
    - "service"
    - "module"
    - "component"
    - "package"
    - "library"
    - "framework"
    - "architecture"
    - "design"
    - "pattern"
    - "api"
    - "endpoint"
    - "interface"
    - "database"
    - "schema"
    - "query"
    - "cache"
    - "queue"
    - "thread"
    - "process"
    - "dependency"
    - "bug"
    - "error"
    - "exception"
    - "crash"
    - "debug"
    - "fix"
    - "solution"
    - "workaround"
    - "issue"
    - "pull request"
    - "code review"
    - "test"
    - "unit test"
    - "integration test"
    - "deploy"
    - "deployment"
    - "build"
    - "ci"
    - "pipeline"
    - "refactor"
    - "performance"
    - "latency"
    - "memory"
    - "algorithm"
    - "function"
    - "class"
    - "method"
    - "object"
    - "variable"
    - "compiler"
    - "runtime"
    - "container"
    - "docker"
    - "kubernetes"
    - "git"
    - "branch"
    - "merge"
    - "AI agent"
    - "Copilot"
    - "Cursor"
    - "Claude Code"
    - "coding agent"
    - "SWE agent"
    - "GitHub Copilot"
    - "AI coding"

  exclusion_terms:
    - "AI art"
    - "image generation"
    - "DALL-E"
    - "Midjourney"
    - "Stable Diffusion"
    - "non-developer"

# Analogy type classification heuristics
analogy_patterns:
  structural:
    - "architecture"
    - "structure"
    - "stack"
    - "layer"
    - "foundation"
    - "building"
    - "blueprint"
    - "pipeline"
    - "graph"
    - "tree"
    - "network"
    - "mesh"
    - "skeleton"
  functional:
    - "tool"
    - "drill"
    - "instrument"
    - "engine"
    - "machine"
    - "attachment"
    - "plugin"
    - "extension"
    - "filter"
    - "router"
    - "translator"
    - "adapter"
    - "cache"
    - "queue"
  process:
    - "junior dev"
    - "intern"
    - "team member"
    - "collaboration"
    - "pair programming"
    - "code review"
    - "engineer"
    - "assembly line"
    - "workflow"
    - "factory"
    - "handoff"
    - "debugging"
    - "triage"
  cross_domain:
    - "lottery"
    - "weather"
    - "cooking"
    - "driving"
    - "autopilot"
    - "game"
    - "music"
    - "plumbing"
    - "traffic"
    - "garden"
    - "recipe"
    - "map"
    - "warehouse"

# Platform-specific configurations
platforms:
  stackoverflow:
    enabled: true
    api_base: "https://api.stackexchange.com/2.3"
    page_size: 100
    max_pages: 50
    tags:
      - "debugging"
      - "software-design"
      - "design-patterns"
      - "architecture"
      - "api"
      - "database"
      - "multithreading"
      - "performance"
      - "testing"
      - "unit-testing"
      - "git"
      - "docker"
      - "kubernetes"
      - "microservices"
      - "refactoring"
      - "dependency-injection"
      - "github-copilot"
      - "cursor-ide"
    # Stack Exchange API key (optional but recommended for higher quota)
    api_key: null  # Set via STACKOVERFLOW_API_KEY env var

  reddit:
    enabled: true
    subreddits:
      - "programming"
      - "softwareengineering"
      - "ExperiencedDevs"
      - "learnprogramming"
      - "webdev"
      - "devops"
      - "AskProgramming"
      - "coding"
      - "ChatGPTCoding"
      - "cursor"
    sort: "relevance"
    time_filter: "year"
    limit: 1000
    # Reddit API credentials (REQUIRED - via Reddit App)
    client_id: null      # Set via REDDIT_CLIENT_ID env var
    client_secret: null  # Set via REDDIT_CLIENT_SECRET env var
    user_agent: "AnalogicalReasoningResearch/1.0 (Academic Study)"

  github:
    enabled: true
    api_base: "https://api.github.com"
    per_page: 100
    max_results: 1000
    # Discover repositories via GET /search/repositories (sorted by stars, desc)
    top_starred_repos:
      enabled: true
      count: 100
      # Repository search `q` (see https://docs.github.com/en/search-github/searching-on-github/searching-for-repositories)
      repository_search_query: "stars:>=1"
    # Optional extra owner/repo names to search in addition to top_starred_repos (deduped)
    search_repos: []
    # GitHub Personal Access Token (REQUIRED for search API)
    token: null  # Set via GITHUB_TOKEN env var

  zenodo:
    enabled: true
    api_base: "https://zenodo.org/api"
    max_records: 500
    communities:
      - "softwareengineering"
      - "ai"
    # Search query for Zenodo records
    query: "analogical reasoning software engineering"

  huggingface:
    enabled: true
    api_base: "https://huggingface.co/api"
    # Candidate repositories are discovered from these hub namespaces
    repo_types:
      - "models"
      - "datasets"
      - "spaces"
    # Cap repository discovery so collection runtime remains bounded
    max_repositories: 30
    per_term_repo_limit: 10
    per_page: 20
    max_results: 100
    # Hub repository search query used to discover candidates
    repository_search_query: "software engineering debugging architecture api database testing devops"
    # Optional additional owner/repo names to scan (deduped with discovered repos)
    search_repos: []
    # Optional Hugging Face token (recommended for better limits)
    token: null  # Set via HUGGINGFACE_TOKEN env var

  discord:
    enabled: false  # Disabled by default - requires server owner permission
    # Discord data collection is ethically complex. See README for details.
    # If enabled, requires DISCORD_BOT_TOKEN env var
    servers: []
    channels: []

  # ---------------------------------------------------------------------------
  # Batch A: DEV Community (dev.to) — official Forem API, no auth required
  # Optional API key (DEVTO_API_KEY) raises rate limit from ~10 to 1000 req/min
  # ---------------------------------------------------------------------------
  devto:
    enabled: true
    api_base: "https://dev.to/api"
    per_page: 30          # max allowed by DEV.to API
    max_pages: 50
    fetch_comments: true
    tags:
      - "programming"
      - "softwaredevelopment"
      - "webdev"
      - "devops"
      - "database"
      - "debugging"
      - "testing"
      - "architecture"
      - "git"
      - "ai"
    api_key: null         # Set via DEVTO_API_KEY env var (optional)

  # ---------------------------------------------------------------------------
  # Batch A: Hashnode — official GraphQL API, no auth required
  # ---------------------------------------------------------------------------
  hashnode:
    enabled: true
    api_url: "https://gql.hashnode.com"
    per_page: 20
    max_pages: 25         # per search query

  # ---------------------------------------------------------------------------
  # Batch B: Hacker News — Algolia HN Search API, no auth required
  # ---------------------------------------------------------------------------
  hackernews:
    enabled: true
    per_page: 20
    max_pages: 20         # per query × type combination
    fetch_comments: true  # also collect comment hits

  # ---------------------------------------------------------------------------
  # Batch B: Lobsters — official JSON feed, no auth required
  # Keep rate_limit >= 1.0s; small community server
  # ---------------------------------------------------------------------------
  lobsters:
    enabled: true
    max_pages: 10
    fetch_comments: true
    tags:
      - "ai"
      - "programming"
      - "practices"
      - "tools"

  # ---------------------------------------------------------------------------
  # Batch C: GitLab — REST API v4, optional token (GITLAB_TOKEN)
  # Without token: 60 req/hr.  With read_api token: 2000 req/min.
  # ---------------------------------------------------------------------------
  gitlab:
    enabled: true
    api_base: "https://gitlab.com/api/v4"
    per_page: 100
    max_pages: 10         # per issue-search batch
    max_projects: 30
    fetch_notes: true     # also collect issue comments
    search_projects: []   # explicit "owner/repo" slugs (deduped with discovery)
    project_search_terms:
      - "software architecture"
      - "debugging"
      - "api"
      - "database"
      - "testing"
      - "devops"
      - "performance"
    token: null           # Set via GITLAB_TOKEN env var

# =============================================================================
# Analogy detection filter settings
# These control the Layer-1 heuristic sense-disambiguation in BaseCollector.
# =============================================================================
analogy_filters:
  # Reject sentences beginning with exemplification heads like "things like X",
  # "stuff like X", "options like X", "such as X", "e.g." etc.
  reject_exemplification: true
  # Reject sentences that express desire/preference: "I'd like", "would like", etc.
  reject_preference: true
  # Require a copula verb (is, are, feels, acts, …) within this many tokens before
  # the analogy indicator. Sentences without one are considered non-analogical.
  require_copula_within_tokens: 6
  # SE terms that, when appearing right after "like a/an", should still be accepted
  # because they carry metaphorical meaning in developer discourse.
  cross_domain_keep:
    - pipeline
    - factory
    - assembly line
    - warehouse
    - garden
    - traffic
    - recipe
    - map
    - black box
    - rubber duck

# =============================================================================
# LLM second-pass analogy verifier
# Change `provider` and `model` to switch between cloud or local LLMs.
# =============================================================================
llm_verifier:
  enabled: false            # Set to true to enable LLM verification pass
  provider: ollama          # openai | anthropic | ollama | lmstudio | openai_compatible | disabled
  model: llama3.1:8b-instruct
  temperature: 0
  requests_per_second: 2   # applies to local servers too (avoids GPU thrash)
  timeout_seconds: 60
  health_check_on_start: true
  cache_path: ./output/llm_cache.jsonl
  context_chars: 600        # surrounding text chars sent alongside the quote

  # Provider-specific settings. Only the active provider's block is used.
  providers:
    openai:
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
    anthropic:
      api_key_env: ANTHROPIC_API_KEY
    ollama:
      base_url: http://localhost:11434  # default Ollama address
    lmstudio:
      base_url: http://localhost:1234/v1
      api_key_env: ""                   # LM Studio ignores the key
    openai_compatible:
      base_url: http://localhost:8000/v1
      api_key_env: LOCAL_LLM_API_KEY

# Deduplication settings
deduplication:
  enabled: true
  similarity_threshold: 0.85  # Cosine similarity threshold
  min_content_length: 50      # Characters

# Rate limiting (seconds between requests)
rate_limits:
  stackoverflow: 0.05   # ~20 req/sec (SE API allows 30 with key)
  reddit: 1.0           # PRAW handles this automatically
  github: 0.5           # 2 req/sec for authenticated requests
  zenodo: 0.5
  huggingface: 0.5
  discord: 1.0
  devto: 0.5            # no key: stay well under 10 req/min limit
  hashnode: 0.5
  hackernews: 0.3       # Algolia is generous; keep polite
  lobsters: 1.0         # small server — be conservative
  gitlab: 0.5           # 2 req/sec with token

# Output schema fields
output_schema:
  - record_id
  - platform
  - source_type
  - url
  - archive_url
  - title
  - author_handle
  - author_id_hash  # Anonymized
  - post_date
  - collection_date
  - content
  - content_length
  - analogy_present
  - analogy_types
  - analogy_quote
  - analogy_confidence
  - target_domain
  - source_domain
  - sldc_phase
  - engagement_score
  - upvotes
  - replies
  - views
  - verified_by
  - collector_version
  # LLM second-pass fields (empty strings when LLM is disabled)
  - llm_verified
  - llm_confidence
  - llm_source_domain
  - llm_target_domain
  - llm_mapping_summary
  - llm_provider_model